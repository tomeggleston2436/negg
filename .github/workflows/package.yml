# Packages the desktop app (Ruling 86). Runs only by hand or for a version
# tag, never on pull requests. It uploads the bundles as workflow artifacts
# and publishes nothing: no release, no signing beyond the ad hoc macOS
# signature, no notarisation (deferred).

name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles app,dmg
            # The .dmg holds the .app; a bare .app directory would lose its
            # permissions and symlinks in the artifact zip.
            artifacts: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            rust-targets: ""
            build-args: --bundles nsis
            artifacts: app/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux
            os: ubuntu-22.04
            rust-targets: ""
            build-args: --bundles appimage
            artifacts: app/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # patchelf and file are needed by the AppImage bundler; it runs its
      # linuxdeploy AppImages extracted (no FUSE on the runner).
      - name: Install the Tauri Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm packages
        run: pnpm install --frozen-lockfile

      - name: npm licences
        run: node scripts/check-licences.mjs

      # `pnpm tauri build` runs `pnpm build` first (beforeBuildCommand).
      - name: Build the bundles
        run: pnpm tauri build ${{ matrix.build-args }}

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: negg-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
