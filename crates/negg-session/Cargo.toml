[package]
name = "negg-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "The negg flows (convert, batch, roll mode, lock) and the Session, shared by the CLI, the desktop app and the C ABI"
publish = false

[dependencies]
dirs = "6"
negg-calib = { path = "../negg-calib", version = "0.0.0" }
negg-cms = { path = "../negg-cms", version = "0.0.0" }
negg-decode = { path = "../negg-decode", version = "0.0.0" }
negg-film = { path = "../negg-film", version = "0.0.0" }
negg-io = { path = "../negg-io", version = "0.0.0" }
negg-render = { path = "../negg-render", version = "0.0.0" }
negg-types = { path = "../negg-types", version = "0.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The GPU preview of Session::render_tile (ADR 0036), for the desktop app.
gpu = ["negg-render/gpu"]

[lints]
workspace = true
