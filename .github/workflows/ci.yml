# Continuous integration for negg.
#
# Jobs are kept separate on purpose: a later phase 0 task adds an `eval` job
# (uploads eval-results.json and fails on metric regressions) alongside these.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per workflow and ref; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  # Format, lint and test the whole workspace on all three desktop platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  # Licence, advisory, ban and source checks against deny.toml.
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Repository conventions that no compiler enforces.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Line 1 of every .rs file under crates/ must be one of the two exact
      # SPDX identifier comments. Any build output under crates/ is skipped.
      - name: SPDX headers
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates ]; then
            echo "No crates/ directory to check"
            exit 0
          fi
          bad=0
          while IFS= read -r -d '' file; do
            first=$(head -n 1 -- "$file")
            case "$first" in
              '// SPDX-License-Identifier: MPL-2.0'|'// SPDX-License-Identifier: Apache-2.0')
                ;;
              *)
                echo "::error file=$file,line=1::missing or incorrect SPDX header"
                echo "$file"
                bad=$((bad + 1))
                ;;
            esac
          done < <(find crates -type d -name target -prune -o -type f -name '*.rs' -print0)
          if [ "$bad" -ne 0 ]; then
            echo "$bad .rs file(s) under crates/ lack a valid SPDX header (listed above)"
            exit 1
          fi
          echo "All .rs files under crates/ carry a valid SPDX header"

      # No em dash (U+2014) or en dash (U+2013) in tracked source, config or
      # prose files. `git ls-files` keeps untracked and ignored files out of
      # scope. IMPLEMENTATION_PLAN.md and LICENSE* files are exempt.
      - name: No em dashes
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          matches=$(
            git ls-files -z -- '*.rs' '*.toml' '*.md' '*.yml' '*.yaml' '*.json' '*.ts' '*.tsx' \
              | grep -z -v -E '(^|/)(IMPLEMENTATION_PLAN\.md|LICENSE[^/]*)$' \
              | xargs -0 -r grep -nP '[\x{2014}\x{2013}]' \
              || true
          )
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::em dash (U+2014) or en dash (U+2013) found in the files listed above"
            exit 1
          fi
          echo "No em or en dashes found"
