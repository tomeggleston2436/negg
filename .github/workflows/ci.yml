# Continuous integration for negg.
#
# Jobs are kept separate on purpose. The `eval` job runs `negg eval` against
# eval-baseline.json with the tolerances in eval.toml, uploads
# eval-results.json and fails on any metric regression.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per workflow and ref; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  # Format, lint and test the whole workspace on all three desktop platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Mesa's software Vulkan driver (lavapipe), so the GPU preview kernel
      # is compared with the CPU kernel on every run (ADR 0036). macOS and
      # Windows runners test it when they expose an adapter and skip it
      # otherwise.
      - name: Install a software GPU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Test
        run: cargo test --workspace --all-features
        env:
          NEGG_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}

  # Licence, advisory, ban and source checks against deny.toml.
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.89"

  # Repository conventions that no compiler enforces.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Line 1 of every .rs file under crates/ must be one of the two exact
      # SPDX identifier comments. Any build output under crates/ is skipped.
      - name: SPDX headers
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d crates ]; then
            echo "No crates/ directory to check"
            exit 0
          fi
          bad=0
          while IFS= read -r -d '' file; do
            first=$(head -n 1 -- "$file")
            case "$first" in
              '// SPDX-License-Identifier: MPL-2.0'|'// SPDX-License-Identifier: Apache-2.0')
                ;;
              *)
                echo "::error file=$file,line=1::missing or incorrect SPDX header"
                echo "$file"
                bad=$((bad + 1))
                ;;
            esac
          done < <(find crates -type d -name target -prune -o -type f -name '*.rs' -print0)
          if [ "$bad" -ne 0 ]; then
            echo "$bad .rs file(s) under crates/ lack a valid SPDX header (listed above)"
            exit 1
          fi
          echo "All .rs files under crates/ carry a valid SPDX header"

      # No em dash (U+2014) or en dash (U+2013) in tracked source, config or
      # prose files. `git grep` sees only tracked files, so untracked and
      # ignored files are out of scope. LICENSE* files are exempt. git grep
      # exits 0 on a match, 1 on no match and 2 or more on an error; no `-e`
      # so the exit code can be inspected.
      - name: No em dashes
        shell: bash
        run: |
          set -uo pipefail
          export LC_ALL=C.UTF-8
          status=0
          git grep -nP '[\x{2014}\x{2013}]' -- '*.rs' '*.toml' '*.md' '*.yml' '*.yaml' '*.json' '*.ts' '*.tsx' \
            ':!LICENSE*' ':!**/LICENSE*' || status=$?
          case "$status" in
            0)
              echo "::error::em dash (U+2014) or en dash (U+2013) found in the files listed above"
              exit 1
              ;;
            1)
              echo "No em or en dashes found"
              ;;
            *)
              echo "::error::grep failed with exit code $status"
              exit 1
              ;;
          esac

  # Score the corpus and fail on any metric that regresses against
  # eval-baseline.json by more than its tolerance in eval.toml. The results
  # are uploaded whether or not the gate passes. The corpus is local-only
  # (docs/ADR/0005), so CI evaluates whatever is present, normally nothing.
  eval:
    name: eval
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Evaluate against the baseline
        run: cargo run --release -p negg-cli -- eval --corpus corpus --out eval-results.json --baseline eval-baseline.json --tolerances eval.toml

      - name: Upload eval-results.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: error

  # The desktop app: its own cargo workspace in app/src-tauri
  # and the React frontend in app/. Everything P3-T verifies locally except
  # the bundle, which package.yml builds. Tauri 2 needs the WebKitGTK
  # development packages on Linux.
  app:
    name: app
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install the Tauri Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # pnpm through Corepack (bundled with Node 22), at the version that
      # wrote pnpm-lock.yaml.
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm packages
        run: pnpm install --frozen-lockfile

      - name: npm licences
        run: node scripts/check-licences.mjs

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm exec vitest run

      # Also the frontend the Tauri context embeds (app/dist).
      - name: Build the frontend
        run: pnpm build

      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: app/src-tauri
        run: cargo test

      # The repository's deny.toml: one licence allow list and one advisory
      # ignore list for both workspaces (`--config` goes before `check`).
      - name: cargo deny check (app)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/src-tauri/Cargo.toml
          arguments: --config deny.toml
          command: check
          rust-version: "1.90"

  # The app's macOS-only code (its own menu with Quit, Undo and Redo) is
  # compiled on macOS only, so the Linux job above never sees it. The
  # frontend is built first because the Tauri context embeds app/dist.
  app-macos:
    name: app (macOS check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm packages
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm build

      - name: Check
        working-directory: app/src-tauri
        run: cargo check --all-targets

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
