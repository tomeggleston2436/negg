[package]
name = "negg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "The negg command-line tool: convert, batch, eval and profile"
publish = false

[[bin]]
name = "negg"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
negg-cms = { path = "../negg-cms", version = "0.0.0" }
negg-decode = { path = "../negg-decode", version = "0.0.0" }
negg-types = { path = "../negg-types", version = "0.0.0" }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tiff = { workspace = true }

[lints]
workspace = true
