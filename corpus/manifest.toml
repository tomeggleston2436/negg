# negg corpus manifest
#
# One [[frame]] entry per RAW scan in this corpus. The eval tool (`negg eval`)
# reads this file, renders every frame with default settings, and compares the
# result against the reference renders and grey-card patch listed here.
# See corpus/README.md for how to add a frame.
#
# Fields of each [[frame]] entry:
#
#   id            string, required, unique. "<roll>-<frame>", e.g. "r001-03".
#   file          string, required. Path relative to corpus/,
#                 e.g. "frames/r001/r001-03.dng".
#   roll          string, required, e.g. "r001". Frames of one roll share film
#                 stock, camera and light source. `negg eval` renders each roll
#                 in roll mode (pooled Dmin, gamma and cast, docs/ADR/0017) and
#                 reports the spread of the per-frame Dmin and gammas over the
#                 roll's Dmin inliers (Gate 2, docs/ADR/0019).
#   stock         string, required. Film stock, e.g. "Kodak Portra 400".
#   camera        string, required. The scanning camera, e.g. "Fujifilm X-T4".
#   light_source  string, required. The backlight, e.g. "Cinestill CS-Lite".
#   has_grey_card bool, required. True when a grey card is in the frame.
#   grey_card     table, optional. Required when has_grey_card = true.
#                 { x, y, width, height } as fractions of image width and
#                 height in [0, 1], describing the card patch used for the
#                 neutrality metric (mean |a*|, |b*| of the patch).
#   references    array of tables, required, may be empty. Each entry is
#                 { tool, file, version } where tool is "negpy",
#                 "negadoctor" or "nlp", file is a path relative to corpus/
#                 such as "reference/r001-03.negpy.tif", and version is the
#                 tool version string the render was made with. "nlp" is a
#                 Negative Lab Pro export (8-bit sRGB JPEG or TIFF, e.g.
#                 "reference/r001-03.nlp.jpg"), cropped by hand and possibly
#                 mirrored or turned: `negg eval` registers it onto the
#                 render and scores only the overlap (docs/ADR/0028).
#   notes         string, required, may be empty. Free text about the frame.
#   contributor   string, required. Who contributed the frame.
#   licence       string, required. "Apache-2.0" or "CC0-1.0". By setting this
#                 the contributor affirms they own the frame and license it
#                 under that licence.
#                 "LicenseRef-Private" marks a frame that is not licensed to
#                 anyone; it is accepted only in a private corpus outside this
#                 repository (see corpus/README.md) and never in this file.
#   film_roll     string, optional, e.g. "f001". The physical film roll, when
#                 one roll of film is scanned more than once (each scan its own
#                 `roll`, for example one per light source). Frames of one
#                 film_roll must share `stock`. Used for the Gate 2
#                 three-lights test: a film roll whose grey-card frames span at
#                 least 3 light sources, all with a `rig`, qualifies.
#   rig           string, optional. Rig profile (*.rig.negg.toml) the roll is
#                 rendered with, relative to corpus/ (may start with "../", for
#                 example "../profiles/rig/bench.rig.negg.toml"). Every frame of
#                 a roll must give the same value, or none.
#   film_profile  string, optional. Film profile (*.film.negg.toml) the roll is
#                 rendered with, relative to corpus/ as for `rig`. Every frame
#                 of a roll must give the same value, or none.
#   geometry      table, optional. The frame's geometry, as Settings.geometry:
#                 { crop = { x, y, width, height }, analysis_buffer,
#                 rotate_degrees, flip_horizontal }, every field optional
#                 (no crop, buffer 0.05, 0 degrees, no flip). The crop is in
#                 fractions of the scan in its decoded orientation, for
#                 example to remove the film holder. `negg eval` renders the
#                 frame with it as a frame override (the roll still pools)
#                 and scores the references against the cropped, turned
#                 render; the grey_card rect stays on the whole scan. The
#                 manifest geometry has no analysis_area yet (deferred; an
#                 unknown key is an error), so use a crop to keep the holder
#                 out of the analysis.
#
schema_version = 1

# Example entry (uncomment to use as a template):
#
# [[frame]]
# id = "r001-03"
# file = "frames/r001/r001-03.dng"
# roll = "r001"
# stock = "Kodak Portra 400"
# camera = "Fujifilm X-T4"
# light_source = "Cinestill CS-Lite"
# has_grey_card = true
# grey_card = { x = 0.42, y = 0.70, width = 0.08, height = 0.06 }
# references = [
#   { tool = "negpy", file = "reference/r001-03.negpy.tif", version = "0.3.1" },
#   { tool = "negadoctor", file = "reference/r001-03.negadoctor.tif", version = "darktable 4.8.1" },
# ]
# notes = "Overcast daylight, grey card bottom centre, full border visible."
# contributor = "Jane Example"
# licence = "CC0-1.0"
# film_roll = "f001"                                   # optional
# rig = "../profiles/rig/bench.rig.negg.toml"          # optional
# film_profile = "../profiles/film/portra400.film.negg.toml"  # optional
# geometry = { crop = { x = 0.04, y = 0.06, width = 0.92, height = 0.88 } }  # optional

